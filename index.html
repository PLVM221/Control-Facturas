<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Control de facturación</title>
    <link rel="stylesheet" href="styles.css?v=20260604-1" />
    <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script defer src="app.js?v=20260604-1"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="Resumen">
        <div>
          <p class="eyebrow">Mercado Pago vs Odoo</p>
          <h1>Control de facturación</h1>
        </div>
        <button class="ghost-button" id="resetButton" type="button">Limpiar</button>
      </section>

      <section class="upload-grid" aria-label="Carga de archivos">
        <article class="panel">
          <div class="panel-header">
            <h2>Mercado Pago</h2>
            <span class="status-pill" id="mpStatus">Sin archivo</span>
          </div>
          <label class="file-drop">
            <input id="mpFile" type="file" accept=".csv,.txt,.xls,.xlsx" />
            <span>Seleccionar archivo</span>
            <small>CSV, TXT, XLS o XLSX</small>
          </label>
        </article>

        <article class="panel">
          <div class="panel-header">
            <h2>Odoo</h2>
            <span class="status-pill" id="sysStatus">Sin archivo</span>
          </div>
          <label class="file-drop">
            <input id="sysFile" type="file" accept=".csv,.txt,.xls,.xlsx" />
            <span>Seleccionar archivo</span>
            <small>CSV, TXT, XLS o XLSX</small>
          </label>
        </article>
      </section>

      <section class="actions-row" aria-label="Acciones">
        <button id="compareButton" type="button" disabled>Comparar</button>
        <button id="exportButton" type="button" disabled>Exportar reporte actual</button>
        <button id="saveReportButton" class="ghost-button" type="button" disabled>Guardar reporte actual</button>
      </section>

      <section class="metrics-grid compact" aria-label="Métricas">
        <div class="metric">
          <span>Analizadas</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="metric warning">
          <span>Diferencias</span>
          <strong id="diffCount">0</strong>
        </div>
        <div class="metric danger">
          <span>Odoo sin Mercado Pago</span>
          <strong id="missingMpCount">0</strong>
        </div>
      </section>

      <section class="report-shell">
        <div class="report-toolbar">
          <h2 id="activeReportTitle">Diferencias</h2>
          <div class="report-tabs" id="reportTabs" aria-label="Tipo de reporte">
            <button class="tab-button active" type="button" data-report-type="differences">Diferencias</button>
            <button class="tab-button" type="button" data-report-type="missingMp">Odoo sin Mercado Pago</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead id="reportHead"></thead>
            <tbody id="reportBody"></tbody>
          </table>
          <p class="empty-state" id="emptyState">Cargá ambos archivos para comparar.</p>
        </div>
      </section>

      <section class="saved-section" aria-labelledby="savedTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Historial local</p>
            <h2 id="savedTitle">Reportes guardados</h2>
          </div>
        </div>
        <div class="saved-reports" id="savedReports"></div>
        <p class="saved-empty" id="savedEmptyState">Todavía no hay reportes guardados.</p>
      </section>
    </main>
  </body>
</html>
